<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vehicle Transport Agreement | F16 Logistics LLC</title>

<style>
body { font-family: Arial; max-width: 850px; margin: auto; padding: 30px; color: #222; }

h1 { text-align: center; margin-bottom: 5px; }
.subtitle { text-align: center; font-size: 14px; color: gray; margin-bottom: 30px; }

.section { 
    background: #f8f8f8; 
    padding: 25px; 
    border-radius: 6px; 
    margin-bottom: 25px; 
    border: 1px solid #ddd;
}

.row { display: flex; gap: 40px; margin-bottom: 15px; }

.box {
    border: 1px solid #ccc;
    padding: 10px;
    border-radius: 4px;
    background: #fff;
}

.label { font-weight: bold; margin-bottom: 4px; }

hr { border: none; border-top: 1px solid #ddd; margin: 20px 0; }

button { padding: 12px 30px; font-size: 15px; cursor: pointer; margin-top: 10px; }

canvas { border: 1px solid #ccc; width: 100%; height: 150px; margin-bottom: 10px; touch-action: none; }
</style>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbx330p8CdDJXOlePhhQ5LAoCZvpcpi_DXqqi03SpeZvA2kSj8bJbTLl8v9R3PleGl82/exec";

let userIP = "Fetching...";

fetch("https://api.ipify.org?format=json")
.then(res => res.json())
.then(data => { userIP = data.ip; });

function fillData() {
    const p = new URLSearchParams(window.location.search);
    ["vehicle","condition","pickup","pzip","delivery","dzip","date","price"].forEach(id => {
        const val = p.get(id) || "";
        document.getElementById(id).innerText = val;
        document.getElementById("form_"+id).value = val;
    });
}

let canvas, ctx, drawing=false, lastX=0, lastY=0;
function initSignaturePad() {
    canvas = document.getElementById("signature-pad");
    ctx = canvas.getContext("2d");
    const style = getComputedStyle(canvas);
    canvas.width = parseInt(style.width);
    canvas.height = parseInt(style.height);

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        if(e.touches) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function start(e){ drawing=true; const pos=getPos(e); lastX=pos.x; lastY=pos.y; }
    function end(){ drawing=false; }

    function move(e){
        if(!drawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineWidth=2;
        ctx.lineCap='round';
        ctx.strokeStyle="#000";
        ctx.beginPath();
        ctx.moveTo(lastX,lastY);
        ctx.lineTo(pos.x,pos.y);
        ctx.stroke();
        lastX=pos.x;
        lastY=pos.y;
        document.getElementById("signature-input").value = canvas.toDataURL();
    }

    ["mousedown","touchstart"].forEach(evt => canvas.addEventListener(evt,start));
    ["mouseup","mouseout","touchend"].forEach(evt => canvas.addEventListener(evt,end));
    ["mousemove","touchmove"].forEach(evt => canvas.addEventListener(evt,move));
}

function clearSignature(){ 
    ctx.clearRect(0,0,canvas.width,canvas.height); 
    document.getElementById("signature-input").value=""; 
}

// UPDATED IMAGE DESIGN
function generateContractImage(callback) {
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");
    c.width = 850;
    c.height = 1200;

    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.fillStyle = "#000";

    ctx.font = "bold 22px Arial";
    ctx.fillText("F16 Logistics LLC", 50, 50);

    ctx.font = "16px Arial";
    ctx.fillText("Vehicle Transport Agreement", 50, 80);

    let y = 120;

    function title(t){
        ctx.font = "bold 15px Arial";
        ctx.fillText(t, 50, y);
        y += 25;
    }

    function line(l,v){
        ctx.font = "14px Arial";
        ctx.fillText(l + ": " + v, 60, y);
        y += 25;
    }

    title("Customer Details");
    line("Name", document.getElementById("name").value);
    line("Email", document.getElementById("email").value);
    line("Phone", document.getElementById("phone").value);

    y+=10;

    title("Vehicle Details");
    line("Vehicle", document.getElementById("vehicle").innerText);
    line("Condition", document.getElementById("condition").innerText);

    y+=10;

    title("Pickup & Delivery");
    line("Pickup", document.getElementById("pickup").innerText);
    line("Delivery", document.getElementById("delivery").innerText);

    y+=10;

    title("Pricing");
    line("Date", document.getElementById("date").innerText);
    line("Price", "$"+document.getElementById("price").innerText);

    y+=20;

    title("Verification");
    line("Timestamp", new Date().toString());
    line("IP", userIP);

    y+=40;

    ctx.font = "bold 15px Arial";
    ctx.fillText("Customer Signature:", 50, y);

    y+=20;

    const sigImg = new Image();
    sigImg.src = document.getElementById("signature-input").value;

    sigImg.onload = () => {
        ctx.drawImage(sigImg, 50, y, 350, 120);
        callback(c.toDataURL("image/png"));
    };
}

async function handleSubmit(e){
    e.preventDefault();

    const signature = document.getElementById("signature-input").value;
    if(!signature){ alert("Please provide your signature."); return; }

    const data = ["vehicle","condition","pickup","pzip","delivery","dzip","date","price"].reduce((obj,id)=>{
        obj[id] = document.getElementById("form_"+id).value;
        return obj;
    },{});

    data.name = document.getElementById("name").value;
    data.email = document.getElementById("email").value;
    data.phone = document.getElementById("phone").value;

    data.signature = signature;
    data.ip = userIP;
    data.timestamp = new Date().toISOString();
    data.userAgent = navigator.userAgent;

    generateContractImage(async (img) => {
        data.contractImage = img;

        await fetch(SHEET_URL, {
            method:"POST",
            body: JSON.stringify(data)
        });

        document.getElementById("bookingForm").submit();
    });
}

window.onload = function(){
    fillData(); 
    initSignaturePad();
    document.getElementById("bookingForm").addEventListener("submit", handleSubmit);
};
</script>
</head>

<body>

<h1>Vehicle Transport Agreement</h1>
<div class="subtitle">F16 Logistics LLC</div>

<div class="section">

<div class="row">
<div style="flex:1;" class="box">
<div class="label">Name</div>
<input type="text" id="name" required>
</div>

<div style="flex:1;" class="box">
<div class="label">Email</div>
<input type="email" id="email" required>
</div>

<div style="flex:1;" class="box">
<div class="label">Phone</div>
<input type="text" id="phone" required>
</div>
</div>

<hr>

<div class="row">
<div style="flex:2;" class="box"><div class="label">Vehicle</div><div id="vehicle"></div></div>
<div style="flex:1;" class="box"><div class="label">Condition</div><div id="condition"></div></div>
</div>

<div class="row">
<div style="flex:2;" class="box"><div class="label">Pickup</div><div id="pickup"></div></div>
<div style="flex:1;" class="box"><div class="label">ZIP</div><div id="pzip"></div></div>
</div>

<div class="row">
<div style="flex:2;" class="box"><div class="label">Delivery</div><div id="delivery"></div></div>
<div style="flex:1;" class="box"><div class="label">ZIP</div><div id="dzip"></div></div>
</div>

<div class="row">
<div style="flex:2;" class="box"><div class="label">Date</div><div id="date"></div></div>
<div style="flex:1;" class="box"><div class="label">Price</div><div>$<span id="price"></span></div></div>
</div>

</div>

<form id="bookingForm" action="https://formsubmit.co/ranveer.sood45@gmail.com" method="POST">
<input type="hidden" name="Signature" id="signature-input">

<label><strong>Signature:</strong></label>
<canvas id="signature-pad"></canvas>

<button type="submit">Confirm Booking</button>
</form>

</body>
</html>
